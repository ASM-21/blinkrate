[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blinkrate"
version = "1.0.0"
description = "How much of a US utility's reported reliability number is the measurement rule rather than the grid"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Andrew" }]
keywords = [
    "SAIDI", "SAIFI", "IEEE 1366", "major event day", "electric reliability",
    "EIA-861", "distribution reliability", "utility regulation", "undergrounding",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.urls]
Findings = "https://github.com/OWNER/blinkrate/blob/main/FINDINGS.md"
Falsification = "https://github.com/OWNER/blinkrate/blob/main/FALSIFICATION.md"

[tool.setuptools.packages.find]
include = ["blinkrate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::FutureWarning", "ignore::DeprecationWarning"]
