[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blinkrate"
version = "1.0.0"
description = "How much of a US utility's reported reliability number is the measurement rule rather than the grid"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Andrew Morrissey" }]
keywords = [
    "SAIDI", "SAIFI", "IEEE 1366", "major event day", "electric reliability",
    "EIA-861", "distribution reliability", "utility regulation", "undergrounding",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
# Lower bounds are the oldest versions actually verified to reproduce every
# committed result byte for byte, not guesses. See requirements-lock.txt.
dependencies = [
    "numpy>=2.2",
    "pandas>=2.2",
    "scipy>=1.15",
    "statsmodels>=0.14.4",
    "matplotlib>=3.9",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.urls]
Homepage = "https://github.com/ASM-21/blinkrate"
Findings = "https://github.com/ASM-21/blinkrate/blob/main/FINDINGS.md"
Falsification = "https://github.com/ASM-21/blinkrate/blob/main/FALSIFICATION.md"
Literature = "https://github.com/ASM-21/blinkrate/blob/main/LITERATURE.md"
Changelog = "https://github.com/ASM-21/blinkrate/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["blinkrate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::FutureWarning", "ignore::DeprecationWarning"]
