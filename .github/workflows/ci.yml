name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Regenerate every result from the vendored data
        run: python -m blinkrate.run_all
      - name: Tests
        run: pytest -q
      - name: Claims guard
        run: python tools/check_claims.py
