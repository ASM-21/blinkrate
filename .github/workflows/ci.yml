name: ci

on:
  push:
  pull_request:

jobs:
  reproduce:
    # Oldest and newest supported Python. Both must regenerate every committed
    # result byte for byte; the byte-identity was verified across pandas
    # 2.2-3.0, numpy 2.2-2.4, scipy 1.15-1.17 and statsmodels 0.14-0.15.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"

      - name: Calibration cache reproduces bit for bit
        run: |
          python - <<'EOF'
          import numpy as np
          from blinkrate.shared import finite_sample as fs
          fresh = fs.build_calibration()
          with np.load("data/calibration_med.npz") as z:
              assert all(np.array_equal(fresh[k], z[k]) for k in z.files), \
                  "committed calibration surface does not reproduce"
          print("calibration cache reproduces bit for bit")
          EOF

      - name: Regenerate every result from the vendored data
        run: python -m blinkrate.run_all

      - name: Committed results equal regenerated results
        # A result that only exists as a committed file, and not as the output
        # of the committed code, is exactly what this repository exists to
        # prevent. Any byte difference fails the build.
        run: git diff --exit-code -- results/

      - name: Tests
        run: pytest -q

      - name: Claims guard
        run: python tools/check_claims.py
