name: ci

on:
  push:
  pull_request:

jobs:
  reproduce:
    # Oldest and newest supported Python. Both must regenerate every committed
    # result byte for byte. Verified on Python 3.10-3.13 with pandas 2.2.3-3.0.6,
    # numpy 2.2.6-2.5.4, scipy 1.15.3-1.18.1 and statsmodels 0.14.4-0.15.0, under
    # Intel AVX-512 and AMD Zen 3 code paths, since a hosted runner may have
    # either CPU. That is why results are stored to 9 significant figures; see
    # blinkrate/shared/io.py.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"

      - name: Calibration cache reproduces bit for bit
        run: python -m blinkrate.shared.finite_sample --check

      - name: Regenerate every result from the vendored data
        run: python -m blinkrate.run_all

      - name: Committed results equal regenerated results
        # A result that only exists as a committed file, and not as the output
        # of the committed code, is exactly what this repository exists to
        # prevent. Any byte difference fails the build.
        run: git diff --exit-code -- results/

      - name: Tests
        run: pytest -q

      - name: Claims guard
        run: python tools/check_claims.py
